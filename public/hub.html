<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>โต๊ะเกม | เลือกเกมออนไลน์</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .hub { padding-block:clamp(28px,6vw,72px); }
    .hub-intro { border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:24px; }
    .hub h1 { margin:0; }
    .hub-intro p { color:var(--muted); margin:.5rem 0 0; }
    .game-library {
      list-style:none; padding:0; margin:0; display:grid; gap:20px;
      grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));
    }
    .game-tile {
      height:100%; overflow:hidden; display:flex; flex-direction:column;
      border:1px solid var(--line); border-radius:14px; background:var(--panel);
    }
    .game-tile img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#293b30; }
    .incan-cover { aspect-ratio:1200/879; overflow:hidden; }
    .incan-cover img { aspect-ratio:1; transform:translateY(-13.42%); }
    .game-tile-body { flex:1; display:flex; flex-direction:column; align-items:flex-start; padding:18px; }
    .game-tile h2 { font-size:1.65rem; margin:0; line-height:1.25; overflow-wrap:anywhere; }
    .game-tile small { color:var(--gold); margin-top:.35rem; }
    .game-tile p { color:var(--muted); margin:.8rem 0 1.2rem; }
    .game-tile a { margin-top:auto; padding:9px 15px; border-radius:7px; text-decoration:none; }
  </style>
</head>
<body>
  <main class="hub">
    <div class="hub-intro">
      <h1>โต๊ะเกม</h1>
      <p>เลือกเกม แล้วชวนเพื่อนเข้าห้อง</p>
    </div>
    <ul class="game-library" aria-label="เกมที่เปิดให้เล่น">
      <li>
        <article class="game-tile">
          <div class="incan-cover">
            <img src="/assets/incan-gold-cover.png" alt="ปกบอร์ดเกมล่าสมบัติอินคาฉบับภาษาไทย">
          </div>
          <div class="game-tile-body">
            <h2>Incan Gold</h2>
            <small>3–8 คน · เล่นออนไลน์</small>
            <p>สำรวจวิหาร เก็บสมบัติ แล้วตัดสินใจว่าจะกลับแคมป์หรือเสี่ยงไปต่อ</p>
            <a class="primary" href="/games/incan-gold">เข้าเล่น Incan Gold</a>
          </div>
        </article>
      </li>
    </ul>
  </main>
</body>
</html>
