<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>โต๊ะเกม | เลือกเกมออนไลน์</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .hub { max-width:1050px; padding-top:clamp(24px,7vw,80px); }
    .hub h1 { margin:0 0 24px; }
    .game-cover { display:grid; align-items:end; min-height:380px; overflow:hidden;
      border:1px solid var(--line); border-radius:18px;
      background:linear-gradient(0deg,#111a14 2%,#111a14e8 24%,#101a1444 80%),url('/assets/machu.jpg') center 48%/cover #233327; }
    .game-cover-copy { padding:clamp(20px,5vw,44px); }
    .game-cover h2 { font-size:clamp(1.8rem,5vw,3.4rem); line-height:1.15; margin:8px 0; }
    .game-cover p { max-width:38ch; margin:0 0 18px; }
    .game-cover a { display:inline-block; padding:10px 20px; border-radius:8px; text-decoration:none; }
    .game-cover small { color:#ffe193; font-weight:700; }
  </style>
</head>
<body>
  <main class="hub">
    <h1>โต๊ะเกม</h1>
    <article class="game-cover">
      <div class="game-cover-copy">
        <small>3–8 คน · เล่นออนไลน์</small>
        <h2>Incan Gold</h2>
        <p>สำรวจวิหารกับเพื่อน เก็บสมบัติแล้วตัดสินใจว่าจะกลับแคมป์หรือเสี่ยงไปต่อ</p>
        <a class="primary" href="/games/incan-gold">เข้าเล่น Incan Gold</a>
      </div>
    </article>
  </main>
</body>
</html>
